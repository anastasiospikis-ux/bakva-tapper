<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAKVA Empire - Ultimate Pro Edition</title>
    
    <!-- Firebase SDKs & Database Config -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCNHrY94rLwJ0bq_WHkF8...",
          authDomain: "bakva-game.firebaseapp.com",
          projectId: "bakva-game",
          storageBucket: "bakva-game.appspot.com",
          messagingSenderId: "645831669827",
          appId: "1:645831669827:web:140b053b...",
          measurementId: "G-EP0VCGZMPJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Συνάρτηση αποθήκευσης σκορ στη βάση δεδομένων
        window.savePlayerScore = function(userId, score) {
            set(ref(db, 'players/' + userId), {
                score: score,
                lastUpdated: Date.now()
            });
        };
    </script>

    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle, #0b0714, #150f26, #05030a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,215,0,0.08); padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(255,215,0,0.3); cursor: pointer; }
        .rank-badge { font-size: 11px; color: #f1c40f; font-weight: bold; }
        
        .owner-vault {
            width: 100%;
            max-width: 350px;
            background: linear-gradient(135deg, #b91d47, #7f1d1d);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f87171;
        }

        .score-box {
            font-size: 32px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
            margin: 0;
        }
        .passive-income { font-size: 9px; color: #2ecc71; font-weight: bold; }

        .coin-wrapper { position: relative; margin: 2px 0; }
        .coin-btn {
            background: radial-gradient(circle, #f39c12, #d35400);
            border: 4px solid #f1c40f;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset 0 -6px 12px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: transform 0.06s ease;
            outline: none;
            position: relative;
        }
        .coin-btn:active { transform: scale(0.90); }
        .floating-number {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
            text-shadow: 0 0 4px black;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 350px;
        }
        .menu-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 4px;
            border-radius: 6px;
            color: white;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.2); }
        .panel {
            width: 100%;
            max-width: 350px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .energy-bar-container {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            height: 6px;
            padding: 1px;
            margin-top: 2px;
        }
        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 3px;
            transition: width 0.2s linear;
        }
        .energy-info { display: flex; justify-content: space-between; font-size: 8px; color: #ccc; }
        .tg-btn {
            margin-top: 3px;
            width: 100%;
            background: #0088cc;
            color: white;
            border: none;
            padding: 4px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-box {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid #f1c40f; border-radius: 12px;
            width: 90%; max-width: 320px; padding: 12px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .modal-box h3 { color: #f1c40f; margin-top: 0; font-size: 16px; }
        .modal-box p, .modal-box div { font-size: 11px; color: #ddd; line-height: 1.3; text-align: left; }
        .modal-btn {
            background: #f39c12; color: white; border: none; padding: 6px 14px;
            font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 8px; font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Κεντρικό Interface -->
    <div class="header">
        <span class="rank-badge">🏆 BAKVA Empire</span>
        <span style="font-size: 10px; color: #2ecc71;">Online</span>
    </div>

    <div class="score-box" id="scoreDisplay">0</div>

    <div class="coin-wrapper">
        <button class="coin-btn" id="coinButton">BAK</button>
    </div>

    <!-- Πλήρες Μενού με το Shop και όλα τα κουμπιά σου -->
    <div class="menu-grid">
        <button class="menu-btn" onclick="openShopModal()">🛒 Shop</button>
        <button class="menu-btn" onclick="alert('Daily διαθέσιμο σύντομα')">🎁 Daily</button>
        <button class="menu-btn" onclick="alert('Spin σε εξέλιξη')">🎡 Spin</button>
        <button class="menu-btn" onclick="alert('Tap+1 ενεργό')">⚡ Tap+1</button>
        <button class="menu-btn" onclick="alert('Bot ενεργό')">🤖 Bot</button>
        <button class="menu-btn" onclick="alert('Top List')">🏆 Top List</button>
    </div>

    <!-- SHOP MODAL (Για να έχεις έσοδα / κέρδος) -->
    <div id="shopModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3>🛒 BAKVA Store</h3>
            <p>Απόκτησε προνόμια και ενίσχυσε την παραγωγή σου στο παιχνίδι!</p>
            <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin: 8px 0;">
                <b>⚡ Super Turbo Boost (1 Ώρα)</b><br>
                <span style="font-size: 10px; color: #f1c40f;">Διπλασιασμός πόντων σε κάθε κλικ</span>
            </div>
            <button class="modal-btn" onclick="buyItem()">Αγορά με SOL</button><br>
            <button class="modal-btn" style="background: #e74c3c;" onclick="closeShopModal()">Κλείσιμο</button>
        </div>
    </div>

    <script>
        // Λογική ανοίγματος/κλεισίματος Shop
        function openShopModal() {
            document.getElementById('shopModalOverlay').style.display = 'flex';
        }
        function closeShopModal() {
            document.getElementById('shopModalOverlay').style.display = 'none';
        }
        function buyItem() {
            alert("Σύνδεση με Solana Wallet για την ολοκλήρωση της αγοράς και πίστωση κέρδους...");
        }

        // Διαχείριση σκορ και αποθήκευσης στο Firebase
        let score = 0;
        const coinBtn = document.getElementById('coinButton');
        const scoreDisplay = document.getElementById('scoreDisplay');

        coinBtn.addEventListener('click', () => {
            score += 1;
            scoreDisplay.innerText = score;

            if (typeof window.savePlayerScore === 'function') {
                window.savePlayerScore("player_test_user", score);
            }
        });
    </script>
</body>
</html>
